<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lite Mode - AUTO RELAX</title>
<style>
:root {
  --bg: #080b14;
  --bg-card: rgba(18,22,40,0.85);
  --border: rgba(99,102,241,0.12);
  --primary: #818cf8;
  --text: #e2e8f0;
  --text-muted: #64748b;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  width: 580px;
  min-height: 480px;
  max-height: 640px;
  overflow-y: auto;
  padding: 10px;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.15); border-radius: 4px; }
.header {
  display: flex; align-items: center; gap: 6px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.header h1 {
  font-family: 'Comfortaa', 'Segoe UI', sans-serif;
  font-size: 14px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header .lite-badge {
  font-size: 8px; padding: 1px 6px; border-radius: 6px;
  background: rgba(99,102,241,0.15); color: var(--primary);
  font-weight: 700;
}
.form-group { margin-bottom: 6px; }
.form-group label {
  display: block; font-size: 9px; color: var(--text-muted);
  margin-bottom: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
}
.input-row { display: flex; gap: 5px; }
.input-row input { flex: 1; }
input {
  width: 100%; padding: 6px 8px;
  background: rgba(15,23,42,0.8);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  outline: none;
}
input:focus { border-color: var(--primary); }
.btn {
  padding: 5px 12px; border: none; border-radius: 6px;
  font-size: 10px; font-weight: 600; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.btn:active { transform: scale(.96); }
.btn-info {
  background: linear-gradient(135deg, #1e40af, #3b82f6);
  color: #bfdbfe;
}
.btn-info.active { background: linear-gradient(135deg, #065f46, #047857) !important; color: #a7f3d0 !important; }
#scan-url { font-family: monospace; font-size: 11px; }
#scan-status { word-break: break-all; }
#scan-status.scan-ok { color: #6ee7b7; }
#scan-status.scan-err { color: #fca5a5; }
#scan-status.scan-warn { color: #fcd34d; }
.btn-secondary {
  background: rgba(42,48,72,0.7); color: var(--text-muted);
  border: 1px solid var(--border);
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  margin-bottom: 8px;
}
.card h3 {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px;
}
.data-table {
  width: 100%; font-size: 10px; border-collapse: collapse;
}
.data-table th {
  text-align: left; padding: 4px 5px;
  color: var(--text-muted); font-size: 8px;
  text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: rgba(12,15,28,0.95);
}
.data-table td {
  padding: 4px 5px;
  border-bottom: 1px solid rgba(99,102,241,0.04);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.data-table tr:hover td { background: rgba(99,102,241,0.04); }
.data-table .empty td { text-align: center; color: var(--text-muted); padding: 16px; }
.data-scroll { max-height: 180px; overflow-y: auto; }
.stat-row {
  display: flex; gap: 8px; font-size: 10px; color: var(--text-muted);
  margin-bottom: 6px; flex-wrap: wrap;
}
.stat-row span { display: flex; align-items: center; gap: 3px; }
.stat-row strong { font-weight: 700; color: var(--text); }
#status-text {
  font-size: 10px; color: var(--text-muted);
  margin-top: 2px; min-height: 14px;
}
#status-text.dup { color: #ef4444; }
.toast {
  position:fixed; bottom:12px; right:12px; padding:8px 14px; border-radius:8px;
  font-size:11px; font-weight:500; z-index:999; pointer-events:none;
  background:linear-gradient(135deg,#065f46,#047857); color:#a7f3d0;
  border:1px solid rgba(167,243,208,0.12);
  transform:translateY(80px); opacity:0;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.toast.show { transform:translateY(0); opacity:1; }
.toast.error { background:linear-gradient(135deg,#991b1b,#b91c1c); color:#fca5a5; border-color:rgba(252,165,165,0.12); }
.badge {
  display: inline-block; padding: 1px 5px;
  border-radius: 4px; font-size: 9px; font-weight: 600;
}
.badge-success { background: rgba(34,197,94,0.1); color: #6ee7b7; }
.badge-danger { background: rgba(239,68,68,0.1); color: #fca5a5; }
.badge-muted { background: rgba(51,65,85,0.3); color: var(--text-muted); }
.badge-warning { background: rgba(245,158,11,0.1); color: #fcd34d; }
#kode-2-wrap { display: none; }
.cb-wrap { display: flex; align-items: center; gap: 3px; }
.cb-wrap input[type="checkbox"] { width: 12px; height: 12px; accent-color: var(--primary); cursor: pointer; }
.data-table td .actions { display: flex; gap: 2px; }
.data-table td .actions .btn-sm { padding: 2px 5px; font-size: 9px; border-radius: 3px; }
.bulk-bar { display:flex; gap:3px; margin-bottom:5px; align-items:center; flex-wrap:wrap; }
.bulk-bar label { font-size:9px; color:#9ca3af; cursor:pointer; }
.row-approved td { background: rgba(6,95,70,0.1); }
.row-notfound td { background: rgba(153,27,27,0.18); }
.btn-warning { background:linear-gradient(135deg,#d97706,#f59e0b); color:#fef3c7; }
.btn-success { background:linear-gradient(135deg,#047857,#22c55e); color:#a7f3d0; }
.btn-danger { background:linear-gradient(135deg,#b91c1c,#ef4444); color:#fecaca; }
.btn-sm { padding: 3px 8px; font-size: 9px; border-radius: 4px; }
.paste-switch {
  position:relative; display:inline-block; width:22px; height:12px;
  background:rgba(51,65,85,0.4); border-radius:10px;
  transition:background .2s;
}
.paste-slider {
  position:absolute; width:10px; height:10px; border-radius:50%;
  background:#64748b; top:1px; left:1px;
  transition:all .2s;
}
#paste-toggle:checked + .paste-switch { background:rgba(99,102,241,0.4); }
#paste-toggle:checked + .paste-switch .paste-slider {
  background:#818cf8; transform:translateX(10px);
}
.gen-card { padding: 6px 10px; }
.gen-card input { font-size: 11px; }
#gen-result {
  padding: 10px 14px;
  background: rgba(12, 15, 28, 0.6);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 8px;
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.6;
}
#gen-result .pw-line { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
#gen-result .pw-label { color: var(--text-muted); min-width: 70px; font-size: 11px; }
#gen-result .pw-value { color: #e2e8f0; font-weight: 700; font-family: 'Consolas', monospace; font-size: 14px; letter-spacing: 1px; }
#gen-result .pw-message { color: #fcd34d; margin-top: 6px; font-size: 11px; }
#gen-result .pw-copy-btn {
  padding: 4px 10px;
  border: none;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg,#1e40af,#3b82f6);
  color: #bfdbfe;
  transition: all .15s;
}
#gen-result .pw-copy-btn:hover { background: linear-gradient(135deg,#3b82f6,#60a5fa); }
#gen-result .pw-copy-btn.copied { background: #065f46; color: #a7f3d0; }
</style>
</head>
<body>

<div class="header" style="display:flex;align-items:center;gap:6px;">
  <h1 style="flex-shrink:0;">AUTO RELAX</h1>
  <label id="paste-toggle-wrap" style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#64748b;cursor:pointer;user-select:none;margin-left:auto;">
    <input type="checkbox" id="paste-toggle" style="position:absolute;opacity:0;width:0;height:0;">
    <span class="paste-switch" style="width:26px;height:13px;">
      <span class="paste-slider"></span>
    </span>
    Paste
  </label>
  <a href="#" id="open-dashboard" style="color:#818cf8;text-decoration:none;font-size:9px;" tabindex="-1">Dashboard &raquo;</a>
  <span class="lite-badge">LITE</span>
</div>

<div class="card" id="scan-card">
  <div class="form-group">
    <label>Scan Gambar <span style="color:#64748b;font-weight:400;">(deteksi otomatis dari URL)</span></label>
    <div class="input-row">
      <input type="text" id="scan-url" placeholder="Tempel URL gambar...">
    </div>
  </div>
  <div id="scan-status" style="font-size:10px;color:var(--text-muted);min-height:14px;"></div>
  <span id="scan-info" style="display:none;cursor:pointer;font-size:10px;color:#64748b;margin-top:2px;">ⓘ info OCR</span>

  <button id="btn-next-ocr" style="display:none;margin-top:4px;padding:2px 8px;font-size:10px;background:#1e293b;color:#fcd34d;border:1px solid #334155;border-radius:4px;cursor:pointer;" tabindex="-1">Next OCR</button>
</div>

<div class="card">
  <div class="form-group">
    <label>User ID <span style="color:#64748b;font-weight:400;">(tambah "TS" untuk mundur 1 hari)</span></label>
    <div class="input-row">
      <input type="text" id="lite-user" placeholder="Tempel User ID">
      <button class="btn btn-info" id="btn-2x" style="font-weight:700;" tabindex="-1">2x</button>
    </div>
  </div>
  <div class="form-group">
    <label>Kode Tiket <span style="color:#64748b;font-weight:400;">(spasi otomatis)</span></label>
    <input type="text" id="lite-kode" placeholder="Tempel Kode Tiket">
  </div>
  <div id="kode-2-wrap">
    <div class="form-group">
      <label>Kode Tiket 2</label>
      <input type="text" id="lite-kode-2" placeholder="Tempel Kode Tiket 2">
    </div>
  </div>
  <div id="status-text"></div>
</div>

<div class="card gen-card">
  <input type="text" id="gen-user" placeholder="Generate password — tempel User ID" tabindex="-1">
  <div id="gen-result" style="display:none;"></div>
</div>

<div class="card" style="padding:8px 10px;">
  <h3>Data Terbaru</h3>
  <div class="stat-row" id="stat-row">
    <span>Total: <strong id="stat-total">0</strong></span>
    <span style="color:#22c55e;">Approve: <strong id="stat-approved">0</strong></span>
    <span style="color:#ef4444;">Reject: <strong id="stat-rejected">0</strong></span>
    <span style="color:#fbbf24;">Pending: <strong id="stat-pending">0</strong></span>
  </div>
  <div class="bulk-bar">
    <input type="checkbox" id="select-all" style="width:12px;height:12px;accent-color:#818cf8;" tabindex="-1">
    <label for="select-all" tabindex="-1" style="cursor:pointer;">All</label>
    <button class="btn btn-sm btn-warning" id="btn-cekbet-selected" tabindex="-1">Cek Ulang</button>
    <button class="btn btn-sm btn-success" id="btn-bonus-selected" tabindex="-1">Input Bonus</button>
    <button class="btn btn-sm btn-danger" id="btn-delete-selected" tabindex="-1">Hapus</button>
    <span id="bulk-info" style="font-size:9px;color:#6b7280;margin-left:auto;"></span>
  </div>
  <div class="data-scroll">
    <table class="data-table">
      <thead><tr>
        <th style="width:20px;"></th>
        <th>User ID</th>
        <th>Kode Tiket</th>
        <th>Status</th>
        <th>Keterangan</th>
        <th>Bonus</th>
        <th style="width:110px;">Aksi</th>
      </tr></thead>
      <tbody id="lite-table-body">
        <tr class="empty"><td colspan="7">Belum ada data</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../lib/tesseract.min.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
